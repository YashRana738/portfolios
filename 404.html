<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>macOS — Page Not Found</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta http-equiv="refresh" content="3;url=./" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #000000 url('./wallpaper.jpg') center/cover no-repeat fixed;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        color: #f5f5f7;
        padding: 20px;
      }
      .dialog {
        background: rgba(30, 30, 35, 0.75);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        width: 100%;
        max-width: 440px;
        overflow: hidden;
        animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes popIn {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      .titlebar {
        height: 38px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .dot { width: 12px; height: 12px; border-radius: 50%; }
      .dot-red { background: #ff5f56; }
      .dot-yellow { background: #ffbd2e; }
      .dot-green { background: #27c93f; }
      .content {
        padding: 32px 28px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        fill: #f5f5f7;
        margin-bottom: 20px;
        filter: drop-shadow(0 2px 8px rgba(255,255,255,0.2));
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.5;
        color: rgba(245, 245, 247, 0.7);
        margin-bottom: 24px;
      }
      .redirect-hint {
        font-size: 11px;
        color: rgba(245, 245, 247, 0.45);
        margin-bottom: 20px;
      }
      .btn {
        display: inline-block;
        background: #0071e3;
        color: #ffffff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 24px;
        border-radius: 999px;
        box-shadow: 0 4px 14px rgba(0, 113, 227, 0.4);
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: #0077ed;
        transform: scale(1.03);
      }
      .btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="dialog">
      <div class="titlebar">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <div class="content">
        <svg class="logo" viewBox="0 0 814 1000">
          <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z"/>
        </svg>
        <h1>404 — Item Not Found</h1>
        <p>The requested route or file does not exist on this system.</p>
        <div class="redirect-hint">Redirecting back to desktop in 3 seconds...</div>
        <a class="btn" href="./">Return to Desktop</a>
      </div>
    </div>
    <script>
      setTimeout(function() {
        window.location.replace('./');
      }, 3000);
    </script>
  </body>
</html>
