    <!-- macOS Boot Screen Styles -->
    <style>
      #macos-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999999;
        background-color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: all;
      }
      #macos-boot-screen.boot-done {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .boot-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(-20px);
      }
      .boot-logo {
        width: 64px;
        height: 78px;
        fill: #f5f5f7;
        margin-bottom: 45px;
        filter: drop-shadow(0 1px 3px rgba(255, 255, 255, 0.15));
      }
      .boot-bar-track {
        width: 190px;
        height: 4px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .boot-bar-fill {
        height: 100%;
        width: 0%;
        background: #f5f5f7;
        border-radius: 999px;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
        animation: macosBootProgress 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes macosBootProgress {
        0% { width: 0%; }
        20% { width: 22%; }
        55% { width: 68%; }
        80% { width: 88%; }
        100% { width: 100%; }
      }
      .w-\[310px\] {
        width: 310px !important;
        max-width: 310px !important;
      }
    </style>

        </svg>
        <div class="boot-bar-track">
          <div class="boot-bar-fill"></div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        const screen = document.getElementById('macos-boot-screen');
        if (!screen) return;
        const minDuration = 1350;
        const startTime = Date.now();
        let finished = false;
        function dismiss() {
          if (finished) return;
          finished = true;
          const elapsed = Date.now() - startTime;
          const wait = Math.max(0, minDuration - elapsed);
          setTimeout(function() {
            screen.classList.add('boot-done');
            setTimeout(function() {
              if (screen.parentNode) screen.parentNode.removeChild(screen);
            }, 550);
          }, wait);
        }
        if (document.readyState === 'complete') {
          dismiss();
        } else {
          window.addEventListener('load', dismiss, { once: true });
        }
        setTimeout(dismiss, 2200);
      })();
    </script>
    <div id="root"></div>
  </body>
