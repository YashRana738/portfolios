          <div class="boot-bar-fill"></div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        const screen = document.getElementById('macos-boot-screen');
        if (!screen) return;
        const minDuration = 1350;
        const startTime = Date.now();
        let finished = false;
        function dismiss() {
          if (finished) return;
          finished = true;
          const elapsed = Date.now() - startTime;
          const wait = Math.max(0, minDuration - elapsed);
          setTimeout(function() {
            screen.classList.add('boot-done');
            setTimeout(function() {
              if (screen.parentNode) screen.parentNode.removeChild(screen);
            }, 550);
          }, wait);
        }
        if (document.readyState === 'complete') {
          dismiss();
        } else {
          window.addEventListener('load', dismiss, { once: true });
        }
        setTimeout(dismiss, 2200);
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
